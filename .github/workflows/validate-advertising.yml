name: Validate advertising exclusions

on:
  pull_request:
    paths:
      - "scripts/build_advertising.py"
      - "tests/test_advertising.py"
      - "config/advertising-exclusions.json"
      - ".github/workflows/validate-advertising.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify generator syntax and edge cases (offline)
        run: |
          python3 -m py_compile scripts/build_advertising.py
          python3 -m unittest discover -s tests -p test_advertising.py -v
