name: Propose curated advertising rules (review only)

on:
  pull_request:
    paths:
      - ".github/workflows/propose-advertising.yml"
      - "scripts/build_advertising.py"
      - "tests/test_advertising.py"
      - "config/advertising-exclusions.json"
  push:
    branches: [main]
    paths:
      - "config/advertising-exclusions.json"
      - "scripts/build_advertising.py"
      - "tests/test_advertising.py"
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * *" # Only runs after merging to the default branch.

permissions:
  contents: read

concurrency:
  group: surge-advertising-review
  cancel-in-progress: false

jobs:
  verify-source-on-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Unit test locally on the runner
        run: python3 -m unittest discover -s tests -p test_advertising.py -v
      - name: Fetch upstream and validate (read-only; no PR or deployment)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          from urllib.request import urlopen, Request
          config = json.loads(Path("config/advertising-exclusions.json").read_text())
          url = config["source"]
          if not url.startswith("https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/"):
              raise RuntimeError("Unexpected source URL")
          with urlopen(Request(url, headers={"User-Agent": "surge-rules-audit/1.0"}), timeout=75) as reply:
              if not reply.geturl().startswith("https://raw.githubusercontent.com/"):
                  raise RuntimeError("Unexpected redirect")
              data = reply.read(64 * 1024 * 1024 + 1)
          if len(data) > 64 * 1024 * 1024:
              raise RuntimeError("Upstream exceeds limit")
          Path("/tmp/surge-advertising-upstream.list").write_bytes(data)
          print("Downloaded", len(data), "bytes")
          PY
          python3 scripts/build_advertising.py --input /tmp/surge-advertising-upstream.list --report /tmp/surge-advertising-report.json
          python3 scripts/build_advertising.py --input /tmp/surge-advertising-upstream.list --check

  propose:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Unit test before network fetch
        run: python3 -m unittest discover -s tests -p test_advertising.py -v
      - name: Fetch upstream and build review candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          from urllib.request import urlopen, Request
          config = json.loads(Path("config/advertising-exclusions.json").read_text())
          url = config["source"]
          if not url.startswith("https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/"):
              raise RuntimeError("Unexpected source URL")
          with urlopen(Request(url, headers={"User-Agent": "surge-rules-audit/1.0"}), timeout=75) as reply:
              if not reply.geturl().startswith("https://raw.githubusercontent.com/"):
                  raise RuntimeError("Unexpected redirect")
              data = reply.read(64 * 1024 * 1024 + 1)
          if len(data) > 64 * 1024 * 1024:
              raise RuntimeError("Upstream exceeds limit")
          Path("/tmp/surge-advertising-upstream.list").write_bytes(data)
          print("Downloaded", len(data), "bytes")
          PY
          python3 scripts/build_advertising.py --input /tmp/surge-advertising-upstream.list --report /tmp/surge-advertising-report.json
          python3 scripts/build_advertising.py --input /tmp/surge-advertising-upstream.list --check
      - name: Open draft PR; never merge or update devices
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- rules/Advertising.list)" ]; then
            echo "No changes to reviewed advertising candidate."
            exit 0
          fi
          existing="$(gh pr list --state open --base main --limit 100 --json headRefName --jq '.[].headRefName' | grep '^automation/advertising-review-' || true)"
          if [ -n "$existing" ]; then
            echo "Existing draft PR must be reviewed before creating another: $existing"
            exit 0
          fi
          branch="automation/advertising-review-$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add rules/Advertising.list
          git commit -m "chore: propose reviewed advertising filter snapshot"
          git push origin "$branch"
          {
            echo "## Curated advertising rules: review required"
            echo
            echo "This candidate excludes only approved exact entries from the upstream source. It is not merged or deployed automatically."
            echo
            cat /tmp/surge-advertising-report.json
            echo
            echo "Check the complete diff, upstream license, domain matching and possible IP/regex effects before approving."
            echo "Any failed validation blocks creation and leaves the stable candidate unchanged."
          } > /tmp/surge-advertising-pr.md
          gh pr create --base main --head "$branch" --draft \
            --title "chore: review curated advertising rule snapshot" \
            --body-file /tmp/surge-advertising-pr.md
