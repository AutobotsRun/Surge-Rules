name: Audit upstream Surge rules

on:
  schedule:
    - cron: "17 3 * * *" # Daily UTC; PR only, never deploy.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: surge-upstream-audit
  cancel-in-progress: false

jobs:
  propose:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout reviewed baseline
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Run unit tests before network access
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Fetch and validate all sources
        run: python3 scripts/audit_upstreams.py --sync --report "$RUNNER_TEMP/surge-upstreams-report.md"
      - name: Build reviewed service rule candidates only
        run: python3 scripts/build_service_rules.py --write
      - name: Re-run tests and validate generated state before proposing changes
        run: |
          python3 -m py_compile scripts/audit_upstreams.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 scripts/audit_upstreams.py
          python3 scripts/build_service_rules.py --check
      - name: Propose changes in a draft PR (no merge or release)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Stage only reviewed audit artifacts, never test caches or unrelated files.
          git add -A -- upstreams/
          if [ -d upstream/ ]; then
            git add -A -- upstream/
          fi
          git add -A -- rules/Google.list rules/YouTube.list rules/Apple.list rules/OpenAI.list rules/Telegram.list rules/Netflix.list rules/Spotify.list rules/HBO.list
          if git diff --cached --quiet; then
            echo "All monitored rules unchanged."
            exit 0
          fi
          existing="$(gh pr list --state open --base main --limit 100 --json headRefName --jq '.[].headRefName' | grep '^automation/upstream-audit-' || true)"
          if [ -n "$existing" ]; then
            echo "An upstream audit PR is already open: $existing"
            echo "No branch was rewritten. Review/merge/close the pending PR first."
            exit 0
          fi
          branch="automation/upstream-audit-$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -m "chore: propose reviewed upstream rule fingerprints"
          git push origin "$branch"
          gh pr create \
            --base main --head "$branch" --draft \
            --title "chore: review changed upstream Surge rules" \
            --body-file "$RUNNER_TEMP/surge-upstreams-report.md"
