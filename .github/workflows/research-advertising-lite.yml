name: Compare Advertising Lite candidates (read-only)

on:
  pull_request:
    paths:
      - "scripts/research_advertising_lite.py"
      - "scripts/preview_advertising_lite.py"
      - "scripts/export_advertising_lite_test_artifact.py"
      - "tests/test_advertising_lite_research.py"
      - "tests/test_advertising_lite_preview.py"
      - "tests/test_advertising_lite_export.py"
      - ".github/workflows/research-advertising-lite.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test conservative source parsing offline
        run: python3 -m unittest discover -s tests -p 'test_advertising_lite*.py' -v
      - name: Compare public sources without any deployment
        run: python3 scripts/research_advertising_lite.py
      - name: Memory-only preview against pinned sources (counts and hash only)
        run: python3 scripts/preview_advertising_lite.py
      - name: Build TEST-ONLY Surge ruleset with attribution (draft PR only)
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == true
        run: python3 scripts/export_advertising_lite_test_artifact.py
      - name: Upload draft PR test archive (not a published subscription)
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: advertising-lite-surge-test-only
          path: /tmp/advertising-lite-surge-test-only/
          if-no-files-found: error
          retention-days: 7
      # Explicitly limited to this owner's same-repo PR #12. This one-time
      # research-branch publication makes a pinned, attributed test resource
      # reachable by Surge iOS; it cannot write the production/default branch.
      - name: Publish TEST-ONLY bundle to the research branch
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 12 && github.event.pull_request.draft == true && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if [ "$HEAD_BRANCH" != "research/advertising-lite-source-comparison" ]; then
            echo "Unexpected branch"; exit 1
          fi
          git fetch --no-tags origin "refs/heads/$HEAD_BRANCH"
          git checkout -B "$HEAD_BRANCH" "FETCH_HEAD"
          dest="experiments/advertising-lite"
          mkdir -p "$dest"
          # A published test snapshot must never be silently replaced.
          if [ -e "$dest/Advertising-Lite-TEST.list" ]; then
            test "$(sha256sum "$dest/Advertising-Lite-TEST.list" | cut -d' ' -f1)" = "240347ee54b5baee112535ea647a8cce4878bba5b971924072066bdedf8ed0a7"
            echo "Pinned test artifact already published; no changes."
            exit 0
          fi
          cp /tmp/advertising-lite-surge-test-only/Advertising-Lite-TEST.list "$dest/"
          cp /tmp/advertising-lite-surge-test-only/LICENSE.GPL-3.0.txt "$dest/"
          cp /tmp/advertising-lite-surge-test-only/THIRD_PARTY_NOTICES.md "$dest/"
          cp /tmp/advertising-lite-surge-test-only/manifest.json "$dest/"
          test "$(sha256sum "$dest/Advertising-Lite-TEST.list" | cut -d' ' -f1)" = "240347ee54b5baee112535ea647a8cce4878bba5b971924072066bdedf8ed0a7"
          git add -- "$dest"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'test: publish pinned, attributed 2890-rule Lite bundle on research branch only'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push origin "HEAD:refs/heads/$HEAD_BRANCH"
      - name: Upload statistics only (not original blocklists)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: advertising-lite-source-comparison
          path: /tmp/advertising-lite-comparison.json
          retention-days: 14
