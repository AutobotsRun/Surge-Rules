name: Validate unified WeChat rules

on:
  pull_request:
    paths:
      - "custom/**"
      - "sources/blackmatrix7/**"
      - "rules/WeChat.list"
      - "scripts/build_wechat.py"
      - ".github/workflows/validate-wechat.yml"
  push:
    branches: [main]
    paths:
      - "custom/**"
      - "sources/blackmatrix7/**"
      - "rules/WeChat.list"
      - "scripts/build_wechat.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate Python and generated rule set
        run: |
          python3 -m py_compile scripts/build_wechat.py
          python3 scripts/build_wechat.py --check
